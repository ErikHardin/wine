<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hardin Wine Cellar</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Hardin Wine" />
<meta name="theme-color" content="#f5ede0" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />

<style>
  /* ── Variables ── */
  :root {
    --cream:      #f5ede0;
    --cream-dark: #ede0cc;
    --parchment:  #e8d5b7;
    --gold:       #b8860b;
    --gold-light: #d4a843;
    --gold-pale:  #f0d080;
    --brown:      #6b3d1e;
    --brown-mid:  #8b5a2b;
    --brown-light:#a87848;
    --brown-pale: #c8a070;
    --ink:        #2c1a0e;
    --ink-mid:    #4a2e18;
    --ink-light:  #7a5030;
    --red-wine:   #8b2635;
    --white-wine: #c8a830;
    --rose-wine:  #c06070;
    --spark-wine: #5090b0;
    --surface:    rgba(255,255,255,0.55);
    --surface-2:  rgba(255,255,255,0.35);
    --surface-3:  rgba(255,255,255,0.2);
    --border:     rgba(184,134,11,0.2);
    --border-2:   rgba(184,134,11,0.12);
    --shadow:     0 2px 16px rgba(107,61,30,0.12);
    --shadow-lg:  0 8px 32px rgba(107,61,30,0.18);
    --radius:     14px;
    --radius-sm:  9px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Crimson Pro', Georgia, serif;
    background: #f0e6d3;
    color: var(--ink);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* Parchment texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    background-size: 180px;
    opacity: 1;
  }

  /* Warm gradient background */
  body::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(212,168,67,0.15) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(139,86,43,0.1) 0%, transparent 50%);
  }

  #app { position: relative; z-index: 1; min-height: 100vh; }

  /* ── Typography ── */
  .serif { font-family: 'Cormorant Garamond', Georgia, serif; }

  /* ── Buttons ── */
  button { cursor: pointer; font-family: inherit; border: none; background: none; }

  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--gold) 0%, #8b6010 100%);
    color: var(--cream); border-radius: var(--radius-sm); border: none;
    font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 700;
    letter-spacing: 0.5px; box-shadow: 0 4px 18px rgba(184,134,11,0.35);
    transition: all 0.2s; transform: translateY(0);
  }
  .btn-primary:active { transform: translateY(1px); box-shadow: 0 2px 10px rgba(184,134,11,0.3); }

  .btn-ghost {
    width: 100%; padding: 13px;
    background: var(--surface-2); border-radius: var(--radius-sm);
    border: 1px solid var(--border); color: var(--brown-mid);
    font-size: 14px; transition: all 0.2s;
  }

  .btn-danger {
    width: 100%; padding: 13px;
    background: rgba(139,38,53,0.08); border: 1px solid rgba(139,38,53,0.2);
    border-radius: var(--radius-sm); color: var(--red-wine);
    font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 700;
  }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 10px;
  }

  /* ── Inputs ── */
  input, select, textarea {
    width: 100%; font-family: 'Crimson Pro', serif;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--ink);
    padding: 11px 13px; font-size: 15px; outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold-light);
    background: rgba(255,255,255,0.75);
  }
  input::placeholder, textarea::placeholder { color: var(--brown-pale); }
  textarea { resize: none; min-height: 80px; line-height: 1.6; }

  .input-error { border-color: var(--red-wine) !important; }

  .field-label {
    color: var(--brown-mid); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 6px; display: block;
    font-family: 'Cormorant Garamond', serif;
  }

  /* ── Tags / Pills ── */
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px; font-size: 12px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--brown-mid);
  }

  /* ── Header ── */
  .app-header {
    padding: 36px 20px 16px;
    background: linear-gradient(180deg, rgba(245,237,224,0.95) 0%, rgba(245,237,224,0) 100%);
    position: sticky; top: 0; z-index: 50;
  }
  .app-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 800; color: var(--ink);
    line-height: 1.1;
  }
  .app-header h1 span { color: var(--gold); }
  .header-divider {
    height: 1px; margin-top: 14px;
    background: linear-gradient(90deg, var(--gold) 0%, transparent 70%);
    opacity: 0.4;
  }

  /* ── Tab bar ── */
  .tab-bar {
    display: flex; gap: 3px;
    background: rgba(107,61,30,0.08); border-radius: 12px;
    padding: 4px; margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1; padding: 9px 2px; border-radius: 9px;
    font-family: 'Cormorant Garamond', serif; font-size: 10px;
    font-weight: 700; letter-spacing: 0.3px; white-space: nowrap;
    color: var(--brown-pale); border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: rgba(184,134,11,0.15);
    color: var(--gold); border-bottom: 2px solid var(--gold);
  }

  /* ── Slot grid ── */
  .slot {
    aspect-ratio: 1; border-radius: 6px; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
    border: 1px solid var(--border-2);
    background: var(--surface-3);
    font-family: monospace; font-weight: 700; font-size: 7px;
    color: var(--brown-pale);
  }
  .slot.occupied {
    background: rgba(184,134,11,0.12);
    border-color: rgba(184,134,11,0.4);
    color: var(--gold);
  }
  .slot:active { transform: scale(0.95); }

  /* ── Color dots ── */
  .color-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  }

  /* ── Drink window bar ── */
  .drink-bar {
    height: 5px; border-radius: 3px;
    background: rgba(107,61,30,0.12);
    overflow: hidden;
  }
  .drink-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s; }

  /* ── Loading spinner ── */
  .spinner {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid rgba(184,134,11,0.2);
    border-top-color: var(--gold);
    animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Modal sheet ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(44,26,14,0.6);
    z-index: 100; display: flex; flex-direction: column;
    justify-content: flex-end; backdrop-filter: blur(2px);
  }
  .modal-sheet {
    background: var(--cream); border-radius: 22px 22px 0 0;
    padding: 22px 20px 44px; max-height: 92vh; overflow-y: auto;
    box-shadow: 0 -8px 40px rgba(107,61,30,0.2); position: relative;
  }
  .modal-handle {
    width: 36px; height: 4px; background: var(--parchment);
    border-radius: 2px; margin: 0 auto 20px;
  }

  /* ── Score badge ── */
  .score-badge {
    font-family: monospace; font-weight: 800; font-size: 12px;
    padding: 3px 9px; border-radius: 8px;
  }

  /* ── PIN screen ── */
  #pin-screen {
    position: fixed; inset: 0; z-index: 200;
    background: linear-gradient(160deg, #f5ede0 0%, #ebe0ca 60%, #f0e6d3 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 30px;
  }
  .pin-dots { display: flex; gap: 16px; margin: 32px 0; }
  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--gold); background: transparent;
    transition: all 0.2s;
  }
  .pin-dot.filled { background: var(--gold); transform: scale(1.1); }
  .pin-dot.error { border-color: var(--red-wine); background: rgba(139,38,53,0.15); }
  .pin-keypad {
    display: grid; grid-template-columns: repeat(3, 72px);
    gap: 12px; margin-top: 8px;
  }
  .pin-key {
    height: 72px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    font-family: 'Cormorant Garamond', serif; font-size: 24px;
    font-weight: 700; color: var(--ink); box-shadow: var(--shadow);
    transition: all 0.15s; display: flex; align-items: center; justify-content: center;
  }
  .pin-key:active { transform: scale(0.93); background: var(--parchment); }
  .pin-key.delete { font-size: 18px; color: var(--brown-mid); }
  .pin-key.empty { background: none; border: none; box-shadow: none; pointer-events: none; }

  /* ── Misc ── */
  .section-label {
    color: var(--brown-mid); font-size: 14px; letter-spacing: 2.5px;
    text-transform: uppercase; margin-bottom: 8px;
    font-family: 'Cormorant Garamond', serif;
  }
  .empty-state { text-align: center; padding: 60px 0; }
  .empty-state .icon { font-size: 44px; margin-bottom: 14px; }
  .empty-state .title {
    font-family: 'Cormorant Garamond', serif; font-size: 20px;
    color: var(--brown-mid); margin-bottom: 6px;
  }
  .empty-state .sub { font-size: 13px; color: var(--brown-pale); line-height: 1.6; }
  .divider { height: 1px; background: var(--border-2); margin: 12px 0; }

  .badge-count {
    background: rgba(184,134,11,0.15); color: var(--gold);
    font-size: 10px; padding: 1px 6px; border-radius: 10px;
    font-family: monospace; font-weight: 700;
  }

  /* Scroll container */
  .scroll-content { padding: 0 20px 100px; }

  /* iOS safe area */
  .modal-sheet { padding-bottom: max(44px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>

<!-- ── PIN Screen ────────────────────────────────────────────────── -->
<div id="pin-screen">
  <div style="text-align:center">
    <div style="font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--brown-pale);margin-bottom:8px;font-family:'Cormorant Garamond',serif">Hardin Wine</div>
    <h1 style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:800;color:var(--ink)">Cellar <span style="color:var(--gold)">Manager</span></h1>
    <p id="pin-subtitle" style="color:var(--brown-mid);font-size:15px;margin-top:10px">Enter your PIN</p>
  </div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <p id="pin-error" style="color:var(--red-wine);font-size:13px;height:18px;text-align:center;margin-bottom:12px"></p>
  <div class="pin-keypad" id="pin-keypad">
    <button class="pin-key" onclick="pinPress(1)">1</button>
    <button class="pin-key" onclick="pinPress(2)">2</button>
    <button class="pin-key" onclick="pinPress(3)">3</button>
    <button class="pin-key" onclick="pinPress(4)">4</button>
    <button class="pin-key" onclick="pinPress(5)">5</button>
    <button class="pin-key" onclick="pinPress(6)">6</button>
    <button class="pin-key" onclick="pinPress(7)">7</button>
    <button class="pin-key" onclick="pinPress(8)">8</button>
    <button class="pin-key" onclick="pinPress(9)">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinPress(0)">0</button>
    <button class="pin-key delete" onclick="pinDelete()">⌫</button>
  </div>
</div>

<!-- ── Main App ──────────────────────────────────────────────────── -->
<div id="app" style="display:none">

  <!-- Header -->
  <div class="app-header">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div>
        <div style="font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--brown-pale);margin-bottom:4px;font-family:'Cormorant Garamond',serif">Hardin Wine</div>
        <h1>Cellar <span>Manager</span></h1>
      </div>
      <div style="display:flex;gap:8px" id="header-badges"></div>
    </div>
    <div class="header-divider"></div>
  </div>

  <!-- Tab content -->
  <div class="scroll-content">
    <div class="tab-bar">
      <button class="tab-btn" onclick="switchTab('trip')" id="tab-trip">🧳 Trip</button>
      <button class="tab-btn active" onclick="switchTab('cellar')" id="tab-cellar">🗂 Cellar</button>
      <button class="tab-btn" onclick="switchTab('find')" id="tab-find">🔍 Find</button>
      <button class="tab-btn" onclick="switchTab('consumed')" id="tab-consumed">🍷 Consumed</button>
    </div>
    <div id="tab-content"></div>
  </div>
</div>

<!-- ── Modals (injected dynamically) ────────────────────────────── -->
<div id="modal-root"></div>

<!-- ── Firebase SDK ─────────────────────────────────────────────── -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── CONFIG — replace with your Firebase project values ──────────
const firebaseConfig = {
  apiKey:            "AIzaSyCk_aDm7hI_lZcbAhC__SN-JTtya0AymFM",
  authDomain:        "wine-5ab2d.firebaseapp.com",
  databaseURL:       "https://wine-5ab2d-default-rtdb.firebaseio.com",
  projectId:         "wine-5ab2d",
  storageBucket:     "wine-5ab2d.firebasestorage.app",
  messagingSenderId: "986727777631",
  appId:             "1:986727777631:web:2cba6b32c16fd1c5dde2ea",
};

// ── Cloudflare Worker URL ────────────────────────────────────────
const WORKER_URL = "https://wine.erikchardin.workers.dev";

// ── Firebase init ────────────────────────────────────────────────
const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);

// ── State ────────────────────────────────────────────────────────
let wines      = {};   // { id: wineObj }
let slots      = {};   // { fridge:{}, winefridge:{}, closet:{} }
let consumed   = {};   // { id: consumedObj }
let appPin     = null; // stored PIN
const SESSION_KEY = "wine_session_ts";
const SESSION_TTL = 30 * 24 * 60 * 60 * 1000; // 30 days in ms
let currentTab = "cellar";
let nextId     = Date.now();
let trips      = {};   // { id: tripObj }
let activeTrip = localStorage.getItem("wine_active_trip") || "";
function setActiveTrip(id) {
  activeTrip = id;
  try { id ? localStorage.setItem("wine_active_trip", id) : localStorage.removeItem("wine_active_trip"); } catch(_) {}
}

// ── Locations ────────────────────────────────────────────────────
const LOCATIONS = (() => {
  const fridgeSlots = [];
  for (let r=1;r<=2;r++) for (let c=1;c<=7;c++) fridgeSlots.push(`R${r}-${c}`);

  const wfSlots = [];
  for (const s of ["A","B","C","D","E"]) for (let i=1;i<=7;i++) wfSlots.push(`${s}${i}`);
  for (const s of ["F","G"])             for (let i=1;i<=5;i++) wfSlots.push(`${s}${i}`);

  const closetSlots = [];
  const sections = [{id:"S1",start:1,rows:2},{id:"S2",start:17,rows:3},{id:"S3",start:41,rows:3}];
  for (const sec of sections)
    for (let r=1;r<=sec.rows;r++)
      for (let c=1;c<=8;c++)
        closetSlots.push(`${sec.id}-R${r}-${String(sec.start+(r-1)*8+(c-1)).padStart(2,"0")}`);

  return {
    fridge:     {id:"fridge",    name:"Main Fridge",    icon:"🧊",color:"#4a9aba",slots:fridgeSlots,
                 grid:{sections:["R1","R2"],cols:7,sectionCols:null}},
    winefridge: {id:"winefridge",name:"Wine Fridge",    icon:"🍷",color:"#b8860b",slots:wfSlots,
                 grid:{sections:["A","B","C","D","E","F","G"],cols:7,
                       sectionCols:{A:7,B:7,C:7,D:7,E:7,F:5,G:5}}},
    closet:     {id:"closet",    name:"Closet Storage", icon:"🗄️",color:"#8b6010",slots:closetSlots,
                 grid:{sections:[
                   {id:"S1",rows:2,label:"Section 1 · Slots 1–16"},
                   {id:"S2",rows:3,label:"Section 2 · Slots 17–40"},
                   {id:"S3",rows:3,label:"Section 3 · Slots 41–64"},
                 ],cols:8}},
  };
})();

const COLOR_OPTIONS   = ["Red","White","Rosé","Sparkling"];
const VARIETAL_OPTIONS= ["Cabernet Sauvignon","Merlot","Chardonnay","Pinot Noir","Sauvignon Blanc",
                          "Bordeaux Blend","Riesling","Syrah/Shiraz","Zinfandel",
                          "Rosé Blend","Red Blend","White Blend","Pinot Grigio","Grenache",
                          "Malbec","Tempranillo","Viognier","Gewürztraminer","Sangiovese",
                          "Sparkling Blend","Other"];
const FOOD_PAIRINGS   = [
  {id:"steak",label:"Steak",emoji:"🥩"},
  {id:"chicken",label:"Chicken",emoji:"🍗"},
  {id:"fish",label:"Fish",emoji:"🐟"},
  {id:"salmon",label:"Salmon",emoji:"🐠"},
  {id:"pork",label:"Pork",emoji:"🥓"},
  {id:"lamb",label:"Lamb",emoji:"🍖"},
  {id:"pasta",label:"Pasta",emoji:"🍝"},
  {id:"pizza",label:"Pizza",emoji:"🍕"},
  {id:"seafood",label:"Seafood",emoji:"🦞"},
  {id:"cheese",label:"Cheese",emoji:"🧀"},
  {id:"mushroom",label:"Mushrooms",emoji:"🍄"},
  {id:"vegetarian",label:"Vegetarian",emoji:"🥗"},
  {id:"spicy",label:"Spicy",emoji:"🌶️"},
  {id:"dessert",label:"Dessert",emoji:"🍰"},
];
const FOOD_ALIASES = {
  steak:["steak","beef","ribeye","filet","red meat","grilled meat"],
  chicken:["chicken","poultry","roast chicken"],
  fish:["fish","halibut","cod","tilapia","sole","tuna"],
  salmon:["salmon","trout"],
  pork:["pork","prosciutto","bacon","ham","sausage","charcuterie"],
  lamb:["lamb","rack of lamb"],
  pasta:["pasta","risotto","linguine","spaghetti","carbonara"],
  pizza:["pizza","flatbread"],
  seafood:["seafood","lobster","shrimp","crab","oyster","scallop","clam"],
  cheese:["cheese","brie","cheddar","gouda","parmesan","charcuterie"],
  mushroom:["mushroom","truffle","earthy"],
  vegetarian:["vegetable","salad","grilled veg","ratatouille","lentil"],
  spicy:["spicy","thai","indian","curry","jalapeño","pepper"],
  dessert:["dessert","chocolate","cake","tart","sweet"],
};

// ── Helpers ──────────────────────────────────────────────────────
const currentYear = new Date().getFullYear();

function drinkStatus(w) {
  if (!w.drinkFrom || !w.drinkTo) return null;
  if (currentYear < w.drinkFrom) return {label:`Open from ${w.drinkFrom}`,color:"#4a9aba",emoji:"⏳"};
  if (currentYear > w.drinkTo)   return {label:"Past peak",color:"#8b2635",emoji:"⚠️"};
  const pct = Math.round(((currentYear-w.drinkFrom)/(w.drinkTo-w.drinkFrom))*100);
  return {label:`Peak now · ${w.drinkFrom}–${w.drinkTo}`,color:"#5a8a3a",emoji:"✅",pct};
}

function scoreColor(s) {
  if (!s) return "var(--brown-pale)";
  if (s>=95) return "#b8860b";
  if (s>=90) return "#8b6010";
  return "var(--brown-mid)";
}

function colorDot(c) {
  return {Red:"#8b2635",White:"#b8960b",Rosé:"#c06070",Sparkling:"#4a80a0"}[c]||"var(--brown-mid)";
}

function matchesFood(wine, foodId) {
  if (!wine.pairings?.length) return false;
  const txt = wine.pairings.join(" ").toLowerCase();
  return (FOOD_ALIASES[foodId]||[foodId]).some(a=>txt.includes(a));
}

function findPlacement(wineId) {
  for (const locId of Object.keys(LOCATIONS))
    for (const [slot,wid] of Object.entries(slots[locId]||{}))
      if (wid===wineId) return {locId,slot};
  return null;
}

function storedWineIds() {
  const ids=new Set();
  for (const locId of Object.keys(LOCATIONS))
    for (const [,wid] of Object.entries(slots[locId]||{}))
      if (wid) ids.add(wid);
  return ids;
}

function el(id){ return document.getElementById(id); }
function ce(tag,props={},children=[]){
  const e=document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==="style") Object.assign(e.style,v);
    else if(k==="class") e.className=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{ if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function html(h){ const d=document.createElement("div"); d.innerHTML=h; return d.firstElementChild; }

function parseLocationHint(raw) {
  const v=(raw||"").trim();
  if(!v) return null;
  if(/^[Ff]ridge$/.test(v)) return {locId:"fridge",slotHint:"any"};
  if(/^[A-Ga-g]$/.test(v)) return {locId:"winefridge",slotHint:v.toUpperCase()};
  const n=parseInt(v);
  if(!isNaN(n)&&n>=1&&n<=64) return {locId:"closet",slotHint:String(n)};
  return null;
}

function closetSlotKey(n) {
  const secs=[{id:"S1",start:1,rows:2},{id:"S2",start:17,rows:3},{id:"S3",start:41,rows:3}];
  for(const sec of secs){
    const end=sec.start+sec.rows*8-1;
    if(n>=sec.start&&n<=end){
      const offset=n-sec.start;
      const r=Math.floor(offset/8)+1;
      return `${sec.id}-R${r}-${String(n).padStart(2,"0")}`;
    }
  }
  return null;
}

function findImportSlot(locId, slotHint, pending) {
  const locSlots=slots[locId]||{};
  const taken=s=>locSlots[s]||(pending[locId]||{})[s];
  const allSlots=LOCATIONS[locId].slots;
  if(locId==="winefridge"){
    for(const s of allSlots) if(s[0]===slotHint&&!taken(s)) return s;
    for(const s of allSlots) if(!taken(s)) return s; // section full, try anywhere
    return null;
  }
  if(locId==="closet"){
    const key=closetSlotKey(parseInt(slotHint));
    return key&&!taken(key)?key:null;
  }
  for(const s of allSlots) if(!taken(s)) return s; // fridge - any slot
  return null;
}

function locHintLabel(loc) {
  if(!loc) return "";
  if(loc.locId==="fridge")     return "🧊 Fridge";
  if(loc.locId==="winefridge") return `🍷 Wine Fridge §${loc.slotHint}`;
  if(loc.locId==="closet")     return `🗄️ Closet #${loc.slotHint}`;
  return "";
}

function splitCSVLine(line, sep) {
  if(sep==="\t") return line.split("\t").map(c=>c.trim().replace(/^"|"$/g,""));
  // Proper quoted-field parser for comma-separated CSV
  const cells=[]; let cur="", inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
    else if(c===","&&!inQ){ cells.push(cur.trim()); cur=""; }
    else cur+=c;
  }
  cells.push(cur.trim());
  return cells;
}

function parseWineCSV(text) {
  const sep = text.includes("\t") ? "\t" : ",";
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = splitCSVLine(lines[0], sep);
  const idx = k => headers.findIndex(h => h.toLowerCase() === k.toLowerCase());
  const colMap = {
    wine:      idx("Wine Name"),
    winery:    idx("Producer"),
    vintage:   idx("Vintage"),
    colorRaw:  idx("Wine Type"),
    varietal:  idx("Grapes"),
    region:    idx("Region"),
    price:     idx("Purchase Price"),
    notes:     idx("Personal Notes"),
    drinkFrom: idx("Drink Window Start"),
    drinkTo:   idx("Drink Window End"),
    addedOn:   idx("Added On"),
    locRaw:    idx("Custom Bottle Location"),
  };
  const normalizeColor = s => {
    const v=(s||"").toLowerCase().trim();
    if(v==="red") return "Red";
    if(v==="white") return "White";
    if(v==="rosé"||v==="rose") return "Rosé";
    if(v==="sparkling"||v==="champagne"||v==="prosecco"||v==="dessert") return "Sparkling";
    return "Red";
  };
  const parseAddedDate = s => {
    if(!s) return Date.now();
    // ISO: 2026-01-03 or 2026-01-03 18:57
    const iso=s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return new Date(parseInt(iso[1]),parseInt(iso[2])-1,parseInt(iso[3])).getTime();
    // M/D/YY: 1/3/26
    const mdy=s.match(/(\d+)\/(\d+)\/(\d+)/);
    if(mdy){ let[,mo,d,yr]=mdy.map(Number); if(yr<100)yr+=2000; return new Date(yr,mo-1,d).getTime(); }
    return Date.now();
  };
  const get=(cells,i)=>i>=0&&i<cells.length?cells[i]:"";
  const results=[];
  for(let i=1;i<lines.length;i++){
    const cells=splitCSVLine(lines[i], sep);
    const wineName=get(cells,colMap.wine);
    if(!wineName) continue;
    results.push({
      wine:      wineName,
      winery:    get(cells,colMap.winery),
      vintage:   get(cells,colMap.vintage),
      color:     normalizeColor(get(cells,colMap.colorRaw)),
      varietal:  get(cells,colMap.varietal),
      region:    get(cells,colMap.region),
      price:     parseFloat(get(cells,colMap.price))||0,
      qty:       1,
      score:     null,
      drinkFrom: parseInt(get(cells,colMap.drinkFrom))||null,
      drinkTo:   parseInt(get(cells,colMap.drinkTo))||null,
      notes:     get(cells,colMap.notes),
      pairings:null,drinkWindow:null,servingTip:null,pairingsAt:null,
      createdAt: parseAddedDate(get(cells,colMap.addedOn)),
      _loc:      parseLocationHint(get(cells,colMap.locRaw)),
    });
  }
  return results;
}

        <div style="font-size:12px;color:var(--brown-mid)">${w.winery}${w.vintage?" · "+w.vintage:""}${w.color?" · "+w.color:""}</div>
      </div>`));
    });
    sheet.appendChild(list);
    if(importRows.length===0){
      sheet.appendChild(html(`<div style="color:var(--red-wine);font-size:13px;margin-bottom:16px;padding:10px 14px;background:rgba(139,38,53,0.06);border-radius:10px">⚠️ No wines found. Check that the file has a "Wine Name" column.</div>`));
    }
    const importBtn=html(`<button class="btn-primary" style="width:100%;margin-bottom:10px"${importRows.length===0?" disabled":""}>Import ${importRows.length} Wine${importRows.length!==1?"s":""}</button>`);
    importBtn.onclick=async()=>{
      importScreen="importing"; renderImportModal();
      const setProgress=t=>{ const p=document.getElementById("import-progress"); if(p) p.textContent=t; };
      const pending={};
      // Phase 1: save wines + assign slots atomically so located wines never flash in the trip tab
      let count=0;
      for(const w of importRows){
        w.id=String(nextId++);
        const {_loc, ...wineData}=w;         // strip temp field before saving
        const writes={[`wines/${w.id}`]:wineData};
        if(_loc){
          const slot=findImportSlot(_loc.locId,_loc.slotHint,pending);
          if(slot){
            writes[`slots/${_loc.locId}/${slot}`]=w.id;
            if(!pending[_loc.locId]) pending[_loc.locId]={};
            pending[_loc.locId][slot]=true;
          }
        }
        await update(ref(db),writes);
        count++;
        setProgress(`Saving wines… ${count} / ${importRows.length}`);
      }
      // Phase 2: fetch pairings for each wine
      let pairCount=0;
      for(const w of importRows){
        setProgress(`Fetching pairings… ${pairCount} / ${importRows.length}`);
        await fetchPairingsForWine(w);
        pairCount++;
      }
      importScreen="done"; renderImportModal();
    };
    sheet.appendChild(importBtn);
    const cancelBtn=html(`<button class="btn-ghost" style="width:100%">Cancel</button>`);
    cancelBtn.onclick=()=>root.innerHTML="";
    sheet.appendChild(cancelBtn);
  }

  else if(importScreen==="importing"){
    sheet.appendChild(html(`<div style="text-align:center;padding:30px 0">
      <div class="spinner" style="width:32px;height:32px;margin:0 auto 16px"></div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold);font-weight:700;margin-bottom:8px">Importing…</div>

      <div style="color:var(--brown-pale);font-size:12px;margin-top:6px">Pairings will be fetched after saving — this may take a minute.</div>
    </div>`));
  }

  else if(importScreen==="done"){
    const withLoc=importRows.filter(w=>w._loc).length;
    sheet.appendChild(html(`<div style="text-align:center;padding:30px 0">
      <div style="font-size:48px;margin-bottom:12px">✅</div>

    </div>`));
    const doneBtn=html(`<button class="btn-primary" style="width:100%;margin-top:20px">Done</button>`);
    doneBtn.onclick=()=>root.innerHTML="";
    sheet.appendChild(doneBtn);
  }

  overlay.appendChild(sheet);
  root.appendChild(overlay);
}

// ── PIN logic ────────────────────────────────────────────────────
let pinEntry = "";
let pinMode  = "check"; // "check" | "set"

async function initPin() {
  const cached = localStorage.getItem(SESSION_KEY);
  if (cached && (Date.now() - Number(cached)) < SESSION_TTL) {
    unlockApp();
    return;
  }

  const snap = await get(ref(db,"config/pin"));
  if (snap.exists()) {
    appPin  = snap.val();
    pinMode = "check";
    el("pin-subtitle").textContent = "Enter your PIN";
  } else {
    pinMode = "set";
    el("pin-subtitle").textContent = "Create a 4-digit PIN";
  }
}

function pinPress(digit) {
  if (pinEntry.length>=4) return;
  pinEntry += digit;
  updatePinDots();
  if (pinEntry.length===4) setTimeout(submitPin, 120);
}

function pinDelete() {
  pinEntry = pinEntry.slice(0,-1);
  updatePinDots();
  el("pin-error").textContent="";
  document.querySelectorAll(".pin-dot").forEach(d=>d.classList.remove("error"));
}

function updatePinDots() {
  for (let i=0;i<4;i++) {
    const d=el(`d${i}`);
    d.classList.toggle("filled", i<pinEntry.length);
  }
}

async function submitPin() {
  if (pinMode==="set") {
    appPin = pinEntry;
    await set(ref(db,"config/pin"), appPin);
    unlockApp();
  } else {
    if (pinEntry===appPin) {
      unlockApp();
    } else {
      document.querySelectorAll(".pin-dot").forEach(d=>d.classList.add("error"));
      el("pin-error").textContent="Incorrect PIN, try again";
      pinEntry="";
      setTimeout(()=>{
        updatePinDots();
        document.querySelectorAll(".pin-dot").forEach(d=>d.classList.remove("error"));
        el("pin-error").textContent="";
      },900);
    }
  }
}

function unlockApp() {
  el("pin-screen").style.display="none";
  el("app").style.display="block";
  initFirebase();
  localStorage.setItem(SESSION_KEY, Date.now().toString());
  render();
}

  });
  tripSel.onchange = e => { setActiveTrip(e.target.value); renderTab(); };
  tripRow.appendChild(tripSel);
  const newTripBtn = html(`<button class="btn-ghost" style="width:auto;padding:10px 14px;font-size:18px;flex-shrink:0">+</button>`);
  newTripBtn.onclick = () => showCreateTripModal();
  tripRow.appendChild(newTripBtn);
  frag.appendChild(tripRow);

  // Capacity bar (only when a specific trip with capacity is selected)
  const trip = activeTrip ? trips[activeTrip] : null;
  if (trip && trip.capacity > 0) {
    const tripWines = Object.values(wines).filter(w => w.tripId === activeTrip);
    const used = tripWines.reduce((s, w) => s + (parseInt(w.qty) || 1), 0);
    const pct  = Math.min(100, Math.round(used / trip.capacity * 100));
    frag.appendChild(html(`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
        <span style="color:var(--brown-mid);font-size:12px">${used} of ${trip.capacity} bottles planned</span>
        <span style="font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:700;color:var(--gold)">${pct}%</span>
      </div>
      <div class="drink-bar"><div class="drink-bar-fill" style="width:${pct}%;background:var(--gold)"></div></div>
    </div>`));
  }

  // Header row
  const unassigned = Object.values(wines).filter(w => {
    if (stored.has(w.id)) return false;
    if (activeTrip) return w.tripId === activeTrip;
    return true;
  });
  const hdr = html(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div class="section-label">${unassigned.length} wine${unassigned.length!==1?"s":""} to store</div>
  </div>`);
  const addBtn = html(`<button class="btn-primary" style="width:auto;padding:8px 18px;font-size:13px">+ Add Wine</button>`);
  addBtn.onclick = () => showAddWineModal();
  hdr.appendChild(addBtn);
  frag.appendChild(hdr);

  if (Object.keys(wines).length===0) {
    frag.appendChild(html(`<div class="empty-state">
      <div class="icon">🍷</div>
      <div class="title">No wines yet</div>
      <div class="sub">Tap <strong>+ Add Wine</strong> to scan a label<br>or enter a wine manually.</div>
    </div>`));
    return frag;
  }

  if (unassigned.length===0) {
    const msg = activeTrip
      ? `<div class="sub">No wines in this trip yet.<br>Tap <strong>+ Add Wine</strong> to add some.</div>`
      : `<div class="sub">Check the Cellar Map or Find a Bottle.</div>`;
    frag.appendChild(html(`<div class="empty-state">
      <div class="icon">✅</div>
      <div class="title" style="color:#5a8a3a">${activeTrip ? "No wines in trip" : "All bottles stored!"}</div>
      ${msg}
    </div>`));
    return frag;
  }

  unassigned.forEach(wine => frag.appendChild(renderTripCard(wine)));
  return frag;
}

// ── CELLAR TAB ───────────────────────────────────────────────────
let cellarActiveLoc = "winefridge";

function renderCellarTab() {
  const frag = document.createDocumentFragment();

  // Overall capacity summary
  const totalOcc = Object.values(LOCATIONS).reduce((s,loc)=>s+Object.values(slots[loc.id]||{}).filter(Boolean).length,0);
  const totalCap = Object.values(LOCATIONS).reduce((s,loc)=>s+loc.slots.length,0);
  const totalPct = totalCap>0?Math.round(totalOcc/totalCap*100):0;
  frag.appendChild(html(`<div style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
      <span style="color:var(--brown-mid);font-size:12px">${totalOcc} of ${totalCap} total slots used</span>
      <span style="font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:700;color:var(--gold)">${totalPct}%</span>
    </div>
    <div class="drink-bar"><div class="drink-bar-fill" style="width:${totalPct}%;background:var(--gold)"></div></div>
  </div>`));

  // Location picker
  const locPicker = document.createElement("div");
  locPicker.style.cssText = "display:flex;gap:8px;margin-bottom:16px";
  Object.values(LOCATIONS).forEach(loc=>{
    const occ = Object.values(slots[loc.id]||{}).filter(Boolean).length;
    const active = cellarActiveLoc===loc.id;
    const btn = html(`<button style="flex:1;padding:10px 3px;border-radius:10px;border:1px solid ${active?loc.color:"var(--border)"};background:${active?loc.color+"18":"var(--surface-3)"};color:${active?loc.color:"var(--brown-pale)"};font-size:10px;font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1.6;cursor:pointer;transition:all 0.2s">
      ${loc.icon}<br>${loc.name}<br><span style="font-size:9px;opacity:0.7">${occ}/${loc.slots.length}</span>
    </button>`);
    btn.onclick=()=>{ cellarActiveLoc=loc.id; renderTab(); };
    locPicker.appendChild(btn);
  });
  frag.appendChild(locPicker);

  const loc = LOCATIONS[cellarActiveLoc];
  const locSlots = slots[cellarActiveLoc]||{};
  const occ = Object.values(locSlots).filter(Boolean).length;
  const total = loc.slots.length;
  const pct = Math.round(occ/total*100);

  // Capacity bar
  frag.appendChild(html(`<div style="margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;margin-bottom:5px">
      <span style="color:var(--brown-mid);font-size:12px">${occ} of ${total} slots used</span>
      <span style="color:${loc.color};font-size:12px;font-weight:700">${pct}%</span>
    </div>
    <div class="drink-bar"><div class="drink-bar-fill" style="width:${pct}%;background:${loc.color}"></div></div>
  </div>`));

  // Slot grid
  const isCloset = cellarActiveLoc==="closet";
  const sections = isCloset ? loc.grid.sections : loc.grid.sections.map(s=>({id:s,rows:1,label:s}));

  sections.forEach(secDef=>{
    const secId = isCloset ? secDef.id : secDef.id;
    const label = cellarActiveLoc==="fridge" ? `Row ${secId.replace("R","")}` :
                  cellarActiveLoc==="winefridge" ? `Section ${secId}` : secDef.label;
    const colCount = loc.grid.sectionCols ? loc.grid.sectionCols[secId] : loc.grid.cols;
    const secSlots = loc.slots.filter(s=>s.startsWith(secId));

    const secDiv = document.createElement("div");
    secDiv.style.marginBottom="16px";
    secDiv.appendChild(html(`<div class="section-label">${label}</div>`));

    const rowCount = isCloset ? secDef.rows : 1;
    for (let r=1;r<=rowCount;r++) {
      const rowSlots = isCloset ? secSlots.filter(s=>s.includes(`-R${r}-`)) : secSlots;
      const grid = document.createElement("div");
      grid.style.cssText=`display:grid;grid-template-columns:repeat(${colCount},1fr);gap:4px;margin-bottom:${rowCount>1?"4px":"0"}`;
      rowSlots.forEach(slot=>{
        const wineId = locSlots[slot];
        const wine   = wineId ? wines[wineId] : null;
        const slotNum = isCloset ? slot.split("-").pop() : slot;
        const s = document.createElement("div");
        s.className = `slot${wine?" occupied":""}`;
        if (wine) { s.style.borderColor=loc.color+"66"; s.style.color=loc.color; }
        s.innerHTML = (wine ? `<div style="font-size:10px">🍷</div>` : "") + `<div style="font-size:${wine?"6":"7"}px;line-height:1">${slotNum}</div>`;
        if (wine) s.onclick=()=>showSlotDetail(cellarActiveLoc,slot,wine);
        grid.appendChild(s);
      });
      secDiv.appendChild(grid);
    }
    frag.appendChild(secDiv);
  });

  return frag;
}

// ── FIND TAB ─────────────────────────────────────────────────────
let findFilters = {color:"",varietal:"",region:"",vintageFrom:"",vintageTo:"",priceMin:"",priceMax:"",scoreMin:"",readyNow:false,food:"",trip:""};
let findQuery = "";

function filterWines(storedWines) {
  return storedWines.filter(w=>{
    if(findQuery && !`${w.winery} ${w.wine} ${w.vintage} ${w.varietal} ${w.region}`.toLowerCase().includes(findQuery.toLowerCase())) return false;
    if(findFilters.color    && w.color!==findFilters.color) return false;
    if(findFilters.varietal && w.varietal!==findFilters.varietal) return false;
    if(findFilters.region   && !w.region?.toLowerCase().includes(findFilters.region.toLowerCase())) return false;
    if(findFilters.vintageFrom && parseInt(w.vintage)<parseInt(findFilters.vintageFrom)) return false;
    if(findFilters.vintageTo   && parseInt(w.vintage)>parseInt(findFilters.vintageTo))   return false;
    if(findFilters.priceMin && w.price<parseInt(findFilters.priceMin)) return false;
    if(findFilters.priceMax && w.price>parseInt(findFilters.priceMax)) return false;
    if(findFilters.scoreMin && (w.score||0)<parseInt(findFilters.scoreMin)) return false;
    if(findFilters.readyNow){ const s=drinkStatus(w); if(!s||!s.label.includes("Peak")) return false; }
    if(findFilters.food && !matchesFood(w,findFilters.food)) return false;
    if(findFilters.trip && w.tripId !== findFilters.trip) return false;
    return true;
  });
}

function refreshFindResults() {
  const container = document.getElementById("find-results-list");
  if (!container) { renderTab(); return; }
  container.innerHTML = "";
  const stored = storedWineIds();
  const storedWines = Object.values(wines).filter(w=>stored.has(w.id));
  const filtered = filterWines(storedWines);
  const hasFilter = Object.values(findFilters).some(Boolean)||findQuery;
  container.appendChild(html(`<div style="color:var(--brown-pale);font-size:12px;margin-bottom:12px">${filtered.length} wine${filtered.length!==1?"s":""} ${hasFilter?"matching":"in cellar"}</div>`));
  if (storedWines.length===0) {
    container.appendChild(html(`<div class="empty-state"><div class="icon">📍</div><div class="title">No wines stored yet</div></div>`));
  } else if (filtered.length===0) {
    const empty = html(`<div class="empty-state"><div class="icon">🔍</div><div class="title">No wines match</div></div>`);
    if(findFilters.food) empty.appendChild(html(`<div class="sub">Get AI pairings on more wine profiles to improve food matching.</div>`));
    container.appendChild(empty);
  } else {
    filtered.forEach(wine=>{ container.appendChild(renderFindCard(wine,findPlacement(wine.id))); });
  }
}

function renderFindTab() {
  const frag = document.createDocumentFragment();
  const stored = storedWineIds();
  const storedWines = Object.values(wines).filter(w=>stored.has(w.id));

  // Filter panel
  frag.appendChild(renderFilterPanel(storedWines, stored));

  // Search — oninput only re-renders the results list, preserving focus
  const searchWrap = document.createElement("div");
  searchWrap.style.marginBottom="12px";
  const inp = document.createElement("input");
  inp.placeholder="Search by name, winery, region…";
  inp.value=findQuery;
  inp.oninput=e=>{ findQuery=e.target.value; refreshFindResults(); };
  searchWrap.appendChild(inp);
  frag.appendChild(searchWrap);

  // Results container (only this part re-renders on text input)
  const resultsList = document.createElement("div");
  resultsList.id = "find-results-list";
  const filtered = filterWines(storedWines);
  const hasFilter = Object.values(findFilters).some(Boolean)||findQuery;
  resultsList.appendChild(html(`<div style="color:var(--brown-pale);font-size:12px;margin-bottom:12px">${filtered.length} wine${filtered.length!==1?"s":""} ${hasFilter?"matching":"in cellar"}</div>`));
  if (storedWines.length===0) {
    resultsList.appendChild(html(`<div class="empty-state"><div class="icon">📍</div><div class="title">No wines stored yet</div></div>`));
  } else if (filtered.length===0) {
    const empty = html(`<div class="empty-state"><div class="icon">🔍</div><div class="title">No wines match</div></div>`);
    if(findFilters.food) empty.appendChild(html(`<div class="sub">Get AI pairings on more wine profiles to improve food matching.</div>`));
    resultsList.appendChild(empty);
  } else {
    filtered.forEach(wine=>{ resultsList.appendChild(renderFindCard(wine,findPlacement(wine.id))); });
  }
  frag.appendChild(resultsList);
  return frag;
}

        </div>
        <div style="color:var(--brown-light);font-size:13px;font-style:italic">${wine.winery}${wine.vintage?" · "+wine.vintage:""}</div>
        <div style="display:flex;gap:8px;margin-top:7px;flex-wrap:wrap;align-items:center">
          ${wine.varietal?`<span style="color:var(--brown-pale);font-size:11px">${wine.varietal}</span>`:""}
          ${wine.score?`<span style="color:${scoreColor(wine.score)};font-size:11px;font-weight:700">${wine.score}pts</span>`:""}
          ${wine.price>0?`<span style="color:var(--brown-mid);font-size:11px">$${wine.price}/btl</span>`:""}
          ${status?`<span style="color:${status.color};font-size:11px">${status.emoji} ${status.label.split("·")[0].trim()}</span>`:""}
        </div>
        ${wine.pairings?.length?`<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">
          ${wine.pairings.slice(0,2).map(p=>`<span style="background:rgba(184,134,11,0.1);border-radius:10px;padding:2px 8px;color:var(--brown-mid);font-size:10px">${p}</span>`).join("")}
          ${wine.pairings.length>2?`<span style="color:var(--brown-pale);font-size:10px">+${wine.pairings.length-2} more</span>`:""}
        </div>`:""}
      </div>
      ${loc?`<div style="text-align:right;flex-shrink:0">
        <div style="background:${loc.color}18;color:${loc.color};font-size:11px;padding:3px 9px;border-radius:9px;font-weight:700;margin-bottom:3px;border:1px solid ${loc.color}33">${loc.icon} ${placement.slot}</div>
        <div style="color:var(--brown-pale);font-size:10px">${loc.name}</div>
      </div>`:""}
    </div>
  </div>`);
  card.onclick=()=>showWineProfile(wine);
  return card;
}

// ── CONSUMED TAB ─────────────────────────────────────────────────
function renderConsumedTab() {
  const frag    = document.createDocumentFragment();
  const entries = Object.values(consumed).sort((a,b)=>b.consumedAt-a.consumedAt);

  if (entries.length===0) {
    frag.appendChild(html(`<div class="empty-state"><div class="icon">🍷</div><div class="title">Nothing consumed yet</div><div class="sub">Mark bottles as consumed from Find a Bottle.</div></div>`));
    return frag;
  }

  entries.forEach(c=>{
    const loc=c.locId?LOCATIONS[c.locId]:null;
    const d=new Date(c.consumedAt);
    const dateStr=d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    frag.appendChild(html(`<div class="card" style="opacity:0.88">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
            <div class="color-dot" style="background:${colorDot(c.color)}"></div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;color:var(--ink)">${c.wine}</div>
          </div>
          <div style="color:var(--brown-light);font-size:12px;font-style:italic">${c.winery}${c.vintage?" · "+c.vintage:""}</div>
          <div style="display:flex;gap:10px;margin-top:5px;flex-wrap:wrap">
            ${c.price>0?`<span style="color:var(--brown-pale);font-size:11px">$${c.price}/btl</span>`:""}
            ${loc?`<span style="color:var(--brown-pale);font-size:11px">${loc.icon} was in ${loc.name} · ${c.slot}</span>`:""}
          </div>
          ${c.pairings?.length?`<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">
            ${c.pairings.slice(0,3).map(p=>`<span style="background:rgba(184,134,11,0.08);border-radius:10px;padding:2px 8px;color:var(--brown-pale);font-size:10px">${p}</span>`).join("")}
          </div>`:""}
        </div>
        <div style="color:var(--brown-pale);font-size:10px;text-align:right;flex-shrink:0;margin-left:10px">${dateStr}</div>
      </div>
    </div>`));
  });

  return frag;
}

// ── ADD WINE MODAL ───────────────────────────────────────────────
let addWineScreen  = "choose"; // choose | scanning | enriching | pairings | form | queue-form
let addWineForm    = {};
let addWineScanPreview = null;
let addWineScanError   = null;
let scanQueue      = [];
let scanQueueIndex = 0;
let isMultiScan    = false;  // true when using sequential multi-bottle scan
let scanQueueSaved = 0;      // bottles saved so far in this multi-scan session

function showAddWineModal() {
  addWineScreen     = "choose";
  addWineForm       = {winery:"",wine:"",vintage:"",color:"Red",varietal:"",region:"",price:"",qty:"1",score:"",drinkFrom:"",drinkTo:"",notes:"",_enrichNote:null,_pairings:null,_drinkWindow:null,_servingTip:null,_tripId:activeTrip||""};
  addWineScanPreview= null;
  addWineScanError  = null;
  scanQueue         = [];
  scanQueueIndex    = 0;
  isMultiScan       = false;
  scanQueueSaved    = 0;
  renderAddWineModal();
}

// Sequential single-bottle scanner used by "Scan Multiple Bottles"
function startMultiScanCamera() {
  addWineForm={winery:"",wine:"",vintage:"",color:"Red",varietal:"",region:"",price:"",qty:"1",score:"",drinkFrom:"",drinkTo:"",notes:"",_enrichNote:null,_pairings:null,_drinkWindow:null,_servingTip:null,_tripId:activeTrip||""};
  addWineScanPreview=null; addWineScanError=null;
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      addWineScanPreview=ev.target.result;
      addWineScreen="scanning"; renderAddWineModal();
      try {
        const b64=ev.target.result.split(",")[1];
        const result=await scanLabel(b64);
        if(result.error){addWineScanError="Couldn't read label — fill in manually."; addWineScreen="form"; renderAddWineModal(); return;}
        addWineForm.winery=result.winery||""; addWineForm.wine=result.wine||"";
        addWineForm.vintage=result.vintage||""; addWineForm.varietal=result.varietal||"";
        addWineForm.region=result.region||"";
        if(COLOR_OPTIONS.includes(result.color)) addWineForm.color=result.color;
        addWineScreen="enriching"; renderAddWineModal();
        try {
          const enriched=await enrichWineData(addWineForm.winery,addWineForm.wine,addWineForm.vintage);
          if(!enriched.error){
            if(enriched.varietal&&!addWineForm.varietal) addWineForm.varietal=enriched.varietal;
            if(enriched.region&&!addWineForm.region) addWineForm.region=enriched.region;
            if(enriched.color&&COLOR_OPTIONS.includes(enriched.color)) addWineForm.color=enriched.color;
            if(enriched.score) addWineForm.score=String(enriched.score);
            if(enriched.avgPrice) addWineForm.price=String(enriched.avgPrice);
            if(enriched.drinkFrom) addWineForm.drinkFrom=String(enriched.drinkFrom);
            if(enriched.drinkTo) addWineForm.drinkTo=String(enriched.drinkTo);
            addWineForm._enrichNote=enriched.note||null;
          }
        } catch(_){}
        addWineScreen="pairings"; renderAddWineModal();
        try {
          const pd=await callPairingsAPI(addWineForm.winery,addWineForm.wine,addWineForm.vintage,addWineForm.varietal,addWineForm.region);
          if(pd.pairings){addWineForm._pairings=pd.pairings; addWineForm._drinkWindow=pd.drinkWindow||null; addWineForm._servingTip=pd.servingTip||null;}
        } catch(_){}
        addWineScreen="queue-form"; renderAddWineModal();
      } catch(_){addWineScanError="Scan failed — fill in manually."; addWineScreen="form"; renderAddWineModal();}
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function renderAddWineModal() {
  const root = el("modal-root");
  root.innerHTML="";

  const overlay=document.createElement("div"); overlay.className="modal-overlay";
  const sheet  =document.createElement("div"); sheet.className="modal-sheet";
  overlay.onclick=e=>{ if(e.target===overlay) root.innerHTML=""; };
  sheet.appendChild(html(`<div class="modal-handle"></div>`));

  const closeBtn=html(`<button style="position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;font-size:20px;color:var(--brown-mid);line-height:1;padding:4px">✕</button>`);
  closeBtn.onclick=()=>{ root.innerHTML=""; };
  sheet.appendChild(closeBtn);

  if (addWineScreen==="choose") {
    sheet.appendChild(html(`<div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:800;color:var(--ink);margin-bottom:6px">Add a Wine</div>`));
    sheet.appendChild(html(`<div style="color:var(--brown-mid);font-size:14px;margin-bottom:24px">How would you like to add it?</div>`));

    // Scan
    const scanBox=html(`<div style="background:rgba(184,134,11,0.06);border:2px dashed rgba(184,134,11,0.3);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;margin-bottom:12px">
      <div style="font-size:42px;margin-bottom:10px">📷</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--gold);margin-bottom:5px">Scan the Label</div>
      <div style="color:var(--brown-mid);font-size:13px;line-height:1.5">Take a photo of the bottle and pre-fill the form.</div>
    </div>`);
    scanBox.onclick=()=>{
      const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
      inp.onchange=async e=>{
        const file=e.target.files[0]; if(!file) return;
        const reader=new FileReader();
        reader.onload=async ev=>{
          addWineScanPreview=ev.target.result;
          addWineScreen="scanning";
          renderAddWineModal();
          try {
            const b64=ev.target.result.split(",")[1];
            // Step 1: Read the label
            const result=await scanLabel(b64);
            if(result.error){ addWineScanError="Couldn't read label — fill in manually."; addWineScreen="form"; renderAddWineModal(); return; }
            addWineForm.winery   = result.winery  ||"";
            addWineForm.wine     = result.wine    ||"";
            addWineForm.vintage  = result.vintage ||"";
            addWineForm.varietal = result.varietal||"";
            addWineForm.region   = result.region  ||"";
            if(COLOR_OPTIONS.includes(result.color)) addWineForm.color=result.color;
            // Step 2: Enrich with Claude knowledge
            addWineScreen="enriching";
            renderAddWineModal();
            try {
              const enriched = await enrichWineData(addWineForm.winery, addWineForm.wine, addWineForm.vintage);
              if(!enriched.error) {
                if(enriched.varietal  && !addWineForm.varietal) addWineForm.varietal  = enriched.varietal;
                if(enriched.region    && !addWineForm.region)   addWineForm.region    = enriched.region;
                if(enriched.color     && !addWineForm.color)    addWineForm.color     = enriched.color;
                if(enriched.score)     addWineForm.score     = String(enriched.score);
                if(enriched.avgPrice)  addWineForm.price     = String(enriched.avgPrice);
                if(enriched.drinkFrom) addWineForm.drinkFrom = String(enriched.drinkFrom);
                if(enriched.drinkTo)   addWineForm.drinkTo   = String(enriched.drinkTo);
                addWineForm._enrichNote = enriched.note||null;
              }
            } catch(e) { console.warn("Enrich failed, continuing:", e); }
            // Step 3: Food pairings using enriched varietal/region
            addWineScreen="pairings";
            renderAddWineModal();
            try {
              const pd = await callPairingsAPI(addWineForm.winery, addWineForm.wine, addWineForm.vintage, addWineForm.varietal, addWineForm.region);
              if(pd.pairings) {
                addWineForm._pairings    = pd.pairings;
                addWineForm._drinkWindow = pd.drinkWindow||null;
                addWineForm._servingTip  = pd.servingTip||null;
              }
            } catch(e) { console.warn("Pairings fetch failed, continuing:", e); }
            addWineScreen="form"; renderAddWineModal();
          } catch { addWineScanError="Scan failed — fill in manually."; addWineScreen="form"; renderAddWineModal(); }
        };
        reader.readAsDataURL(file);
      };
      inp.click();
    };
    sheet.appendChild(scanBox);

    // Multi-scan
    const multiScanBox=html(`<div style="background:rgba(184,134,11,0.04);border:2px dashed rgba(184,134,11,0.2);border-radius:16px;padding:20px;text-align:center;cursor:pointer;margin-bottom:12px">
      <div style="font-size:36px;margin-bottom:8px">📷📷</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--gold);margin-bottom:4px">Scan Multiple Bottles</div>
      <div style="color:var(--brown-mid);font-size:13px">Take one photo with 2+ bottles.<br>Confirm each wine one by one.</div>
    </div>`);
    multiScanBox.onclick=()=>{
      isMultiScan=false; scanQueue=[]; scanQueueIndex=0;
      const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
      inp.onchange=async e=>{
        const file=e.target.files[0]; if(!file) return;
        const reader=new FileReader();
        reader.onload=async ev=>{
          addWineScanPreview=ev.target.result;
          addWineScreen="scanning"; renderAddWineModal();
          try {
            const b64=ev.target.result.split(",")[1];
            // /scan-multi returns { wines: [...] }
            let winesList=null;
            try {
              const r=await fetch(`${WORKER_URL}/scan-multi`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:b64})});
              if(r.ok){const d=await r.json(); if(Array.isArray(d.wines)&&d.wines.length) winesList=d.wines;}
            } catch(_){}
            // Fallback: single-bottle scan
            if(!winesList){
              const result=await scanLabel(b64);
              if(result.error){addWineScanError="Couldn't read label — fill in manually."; addWineScreen="form"; renderAddWineModal(); return;}
              winesList=[result];
            }
            // Build a form object for each detected wine
            const mkForm=()=>({winery:"",wine:"",vintage:"",color:"Red",varietal:"",region:"",price:"",qty:"1",score:"",drinkFrom:"",drinkTo:"",notes:"",_enrichNote:null,_pairings:null,_drinkWindow:null,_servingTip:null,_tripId:activeTrip||""});
            scanQueue=winesList.map(w=>{
              const f=mkForm();
              f.winery=w.winery||""; f.wine=w.wine||""; f.vintage=w.vintage||"";
              f.varietal=w.varietal||""; f.region=w.region||"";
              if(COLOR_OPTIONS.includes(w.color)) f.color=w.color;
              return f;
            });
            scanQueueIndex=0;
            // Enrich + pairings for each wine before showing confirm screens
            for(let i=0;i<scanQueue.length;i++){
              scanQueueIndex=i;
              const q=scanQueue[i];
              addWineScreen="enriching"; renderAddWineModal();
              try {
                const enriched=await enrichWineData(q.winery,q.wine,q.vintage);
                if(!enriched.error){
                  if(enriched.varietal&&!q.varietal) q.varietal=enriched.varietal;
                  if(enriched.region&&!q.region) q.region=enriched.region;
                  if(enriched.color&&COLOR_OPTIONS.includes(enriched.color)) q.color=enriched.color;
                  if(enriched.score) q.score=String(enriched.score);
                  if(enriched.avgPrice) q.price=String(enriched.avgPrice);
                  if(enriched.drinkFrom) q.drinkFrom=String(enriched.drinkFrom);
                  if(enriched.drinkTo) q.drinkTo=String(enriched.drinkTo);
                  q._enrichNote=enriched.note||null;
                }
              } catch(_){}
              addWineScreen="pairings"; renderAddWineModal();
              try {
                const pd=await callPairingsAPI(q.winery,q.wine,q.vintage,q.varietal,q.region);
                if(pd.pairings){q._pairings=pd.pairings; q._drinkWindow=pd.drinkWindow||null; q._servingTip=pd.servingTip||null;}
              } catch(_){}
            }
            // Show first confirmation screen
            scanQueueIndex=0;
            addWineForm={...scanQueue[0]};
            addWineScreen="queue-form"; renderAddWineModal();
          } catch(_){addWineScanError="Scan failed — fill in manually."; addWineScreen="form"; renderAddWineModal();}
        };
        reader.readAsDataURL(file);
      };
      inp.click();
    };
    sheet.appendChild(multiScanBox);

    // Manual
    const manualBox=html(`<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;cursor:pointer;margin-bottom:12px">
      <div style="font-size:32px;margin-bottom:8px">✏️</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--brown-mid);margin-bottom:4px">Enter Manually</div>
      <div style="color:var(--brown-pale);font-size:13px">Type in the wine details yourself.</div>
    </div>`);
    manualBox.onclick=()=>{ addWineScreen="form"; renderAddWineModal(); };
    sheet.appendChild(manualBox);

  }

  else if (addWineScreen==="scanning" || addWineScreen==="enriching" || addWineScreen==="pairings") {
    if(addWineScanPreview){
      const img=document.createElement("img"); img.src=addWineScanPreview;
      img.style.cssText="width:100%;max-height:200px;object-fit:contain;border-radius:12px;margin-bottom:20px;background:#f5ede0";
      sheet.appendChild(img);
    }
    const stepNum = addWineScreen==="scanning"?1:addWineScreen==="enriching"?2:3;
    const multiCtx = scanQueue.length>1 ? ` (wine ${scanQueueIndex+1} of ${scanQueue.length})` : "";
    const stepDefs = [
      {label:"Reading label…",                              sub:"Claude is analyzing your photo"},
      {label:`Looking up wine data…${multiCtx}`,           sub:"Looking up scores, pricing & drink window"},
      {label:`Finding food pairings…${multiCtx}`,          sub:"Matching with food & serving tips"},
    ];
    const stepsEl = document.createElement("div"); stepsEl.style.marginBottom="20px";
    stepDefs.forEach((def,i)=>{
      const n=i+1, done=n<stepNum, active=n===stepNum;
      const row=document.createElement("div"); row.style.cssText="display:flex;align-items:center;gap:10px"+(i<2?";margin-bottom:10px":"");
      const circle=document.createElement("div");
      circle.style.cssText=`width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:2px solid ${done||active?"var(--gold)":"var(--border)"};background:${done?"var(--gold)":active?"rgba(184,134,11,0.15)":"rgba(184,134,11,0.08)"};color:${done?"white":"var(--gold)"}`;
      if(active){ const sp=document.createElement("div"); sp.className="spinner"; sp.style.cssText="width:16px;height:16px;flex-shrink:0;border-width:2px"; circle.appendChild(sp); }
      else { circle.textContent=done?"✓":String(n); }
      const lbl=document.createElement("div");
      lbl.style.cssText=`font-size:14px;color:${done?"var(--gold)":active?"var(--ink)":"var(--brown-pale)"};font-weight:${active?"600":"400"}`;
      lbl.textContent=def.label+(done?" ✓":"");
      row.appendChild(circle); row.appendChild(lbl); stepsEl.appendChild(row);
    });
    const activeDef=stepDefs[stepNum-1];
    const sp=html(`<div style="text-align:center;padding:10px 0">
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold);font-weight:700;margin-bottom:5px">${activeDef.label}</div>
      <div style="color:var(--brown-pale);font-size:13px">${activeDef.sub}</div>
    </div>`);
    sheet.appendChild(stepsEl);
    sheet.appendChild(sp);
  }

  else if (addWineScreen==="form") {
    // Back + title
    const titleRow=html(`<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"></div>`);
    const back=html(`<button style="background:none;border:none;color:var(--brown-mid);font-size:18px;cursor:pointer;padding:0">←</button>`);
    back.onclick=()=>{ addWineScreen="choose"; renderAddWineModal(); };
    titleRow.appendChild(back);
    titleRow.appendChild(html(`<div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:800;color:var(--ink)">${addWineScanPreview?"Confirm Details":"Add Wine"}</div>`));
    sheet.appendChild(titleRow);

    if(addWineScanError) sheet.appendChild(html(`<div style="background:rgba(139,38,53,0.08);border:1px solid rgba(139,38,53,0.2);border-radius:10px;padding:10px 14px;margin-bottom:14px;color:var(--red-wine);font-size:13px">⚠️ ${addWineScanError}</div>`));
    if(addWineForm._enrichNote) sheet.appendChild(html(`<div style="background:rgba(184,134,11,0.08);border:1px solid rgba(184,134,11,0.2);border-radius:10px;padding:10px 14px;margin-bottom:14px;color:var(--gold);font-size:13px">🤖 ${addWineForm._enrichNote}</div>`));
    if(addWineScanPreview){
      const img=document.createElement("img"); img.src=addWineScanPreview;
      img.style.cssText="width:100%;max-height:130px;object-fit:contain;border-radius:10px;margin-bottom:16px;background:#f5ede0;border:1px solid var(--border)";
      sheet.appendChild(img);
    }

    const form=document.createElement("div"); form.style.cssText="display:flex;flex-direction:column;gap:13px";

    // Color pills
    const colorRow=document.createElement("div");
    colorRow.appendChild(html(`<div class="field-label">Color</div>`));
    const pills=document.createElement("div"); pills.style.cssText="display:flex;gap:6px";
    COLOR_OPTIONS.forEach(c=>{
      const active=addWineForm.color===c; const dot=colorDot(c);
      const btn=html(`<button style="flex:1;padding:8px 4px;border-radius:9px;border:1px solid ${active?dot:"var(--border)"};background:${active?dot+"22":"transparent"};color:${active?dot:"var(--brown-pale)"};font-size:11px;cursor:pointer;font-family:inherit;font-weight:700">${c}</button>`);
      btn.onclick=()=>{ addWineForm.color=c; renderAddWineModal(); };
      pills.appendChild(btn);
    });
    colorRow.appendChild(pills); form.appendChild(colorRow);

    // Text fields
    const fields=[
      {key:"winery",label:"Winery *",placeholder:"e.g. Caymus Vineyards"},
      {key:"wine",  label:"Wine Name *",placeholder:"e.g. Special Selection Cabernet"},
    ];
    fields.forEach(f=>{
      const wrap=document.createElement("div");
      wrap.appendChild(html(`<div class="field-label">${f.label}</div>`));
      const inp=document.createElement("input"); inp.placeholder=f.placeholder; inp.value=addWineForm[f.key];
      inp.oninput=e=>addWineForm[f.key]=e.target.value;
      wrap.appendChild(inp); form.appendChild(wrap);
    });

    // Vintage + Qty
    const row1=html(`<div style="display:flex;gap:10px"></div>`);
    ["vintage","qty"].forEach((k,i)=>{
      const w=document.createElement("div"); w.style.flex="1";
      w.appendChild(html(`<div class="field-label">${i===0?"Vintage":"Quantity"}</div>`));
      const inp=document.createElement("input"); inp.placeholder=i===0?"2021":"1"; inp.value=addWineForm[k]; inp.inputMode="numeric"; if(i===0) inp.maxLength=4;
      inp.oninput=e=>addWineForm[k]=e.target.value.replace(/\D/g,"");
      w.appendChild(inp); row1.appendChild(w);
    });
    form.appendChild(row1);

    // Varietal text input with datalist suggestions
    if(!document.getElementById("varietal-suggestions")){
      const dl=document.createElement("datalist"); dl.id="varietal-suggestions";
      VARIETAL_OPTIONS.forEach(v=>{ const o=document.createElement("option"); o.value=v; dl.appendChild(o); });
      document.body.appendChild(dl);

// ── ASSIGN MODAL ─────────────────────────────────────────────────
let assignLoc  = "winefridge";
let assignSlot = null;

function showAssignModal(wine) {
  assignLoc  = "winefridge";
  assignSlot = null;
  renderAssignModal(wine);
}

function renderAssignModal(wine) {
  const root=el("modal-root"); root.innerHTML="";
  const overlay=document.createElement("div"); overlay.className="modal-overlay";
  const sheet  =document.createElement("div"); sheet.className="modal-sheet";
  overlay.onclick=e=>{ if(e.target===overlay) root.innerHTML=""; };
  sheet.appendChild(html(`<div class="modal-handle"></div>`));
  sheet.appendChild(html(`<div style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:800;color:var(--ink);margin-bottom:2px">Assign to Storage</div>`));
  sheet.appendChild(html(`<div style="color:var(--brown-light);font-size:13px;font-style:italic;margin-bottom:18px">${wine.wine} · ${wine.vintage||""}</div>`));

  // Location picker
  const locRow=document.createElement("div"); locRow.style.cssText="display:flex;gap:7px;margin-bottom:18px";
  Object.values(LOCATIONS).forEach(loc=>{
    const active=assignLoc===loc.id;
    const btn=html(`<button style="flex:1;padding:9px 3px;border-radius:9px;border:1px solid ${active?loc.color:"var(--border)"};background:${active?loc.color+"18":"transparent"};color:${active?loc.color:"var(--brown-pale)"};font-size:10px;cursor:pointer;font-family:'Cormorant Garamond',serif;font-weight:700">${loc.icon}<br>${loc.name}</button>`);
    btn.onclick=()=>{ assignLoc=loc.id; assignSlot=null; renderAssignModal(wine); };
    locRow.appendChild(btn);
  });
  sheet.appendChild(locRow);

  sheet.appendChild(html(`<div class="section-label">Select slot · <span style="color:var(--brown-pale)">🍷 = occupied</span></div>`));

  const loc     = LOCATIONS[assignLoc];
  const locSlots= slots[assignLoc]||{};
  const isCloset= assignLoc==="closet";
  const sections= isCloset ? loc.grid.sections : loc.grid.sections.map(s=>({id:s,rows:1}));

  sections.forEach(secDef=>{
    const secId   = isCloset ? secDef.id : secDef.id;
    const colCount= loc.grid.sectionCols ? loc.grid.sectionCols[secId] : loc.grid.cols;
    const label   = assignLoc==="fridge" ? `Row ${secId.replace("R","")}` :
                    assignLoc==="winefridge" ? `Section ${secId}` : secDef.label;
    const secSlots= loc.slots.filter(s=>s.startsWith(secId));

    const secDiv=document.createElement("div"); secDiv.style.marginBottom="12px";
    secDiv.appendChild(html(`<div style="color:var(--brown-pale);font-size:10px;letter-spacing:1px;margin-bottom:5px">${label}</div>`));

    const rowCount=isCloset?secDef.rows:1;
    for(let r=1;r<=rowCount;r++){
      const rowSlots=isCloset?secSlots.filter(s=>s.includes(`-R${r}-`)):secSlots;
      const grid=document.createElement("div");
      grid.style.cssText=`display:grid;grid-template-columns:repeat(${colCount},1fr);gap:4px;margin-bottom:${rowCount>1?"4px":"0"}`;
      rowSlots.forEach(s=>{
        const wid   = locSlots[s];
        const taken = wid && wid!==wine.id;
        const sel   = assignSlot===s;
        const lbl   = isCloset ? s.split("-").pop() : s;
        const btn   = document.createElement("button");
        btn.style.cssText=`aspect-ratio:1;border-radius:5px;border:${sel?`2px solid ${loc.color}`:taken?"1px solid var(--border-2)":"1px solid var(--border)"};background:${sel?loc.color+"22":taken?"rgba(107,61,30,0.04)":"var(--surface-3)"};color:${sel?loc.color:taken?"var(--brown-pale)":"var(--brown-pale)"};font-size:${taken?10:8}px;font-family:monospace;font-weight:700;cursor:${taken?"not-allowed":"pointer"};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;transition:all 0.12s`;
        btn.textContent=taken?"🍷":lbl;
        if(!taken) btn.onclick=()=>{ assignSlot=s; renderAssignModal(wine); };
        grid.appendChild(btn);
      });
      secDiv.appendChild(grid);
    }
    sheet.appendChild(secDiv);
  });

  if(assignSlot){
    sheet.appendChild(html(`<div style="background:rgba(184,134,11,0.1);border:1px solid rgba(184,134,11,0.25);border-radius:10px;padding:11px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <span style="color:var(--brown-mid);font-size:13px">Selected</span>
      <span style="color:${LOCATIONS[assignLoc].color};font-weight:800;font-family:monospace;font-size:16px">${LOCATIONS[assignLoc].name} · ${assignSlot}</span>
    </div>`));
  }

  const saveBtnLabel = assignSlot ? `Save to ${LOCATIONS[assignLoc].name} · ${assignSlot}` : "Select a slot above";
  const saveBtn=html(`<button class="${assignSlot?"btn-primary":"btn-ghost"}" style="${assignSlot?"":"cursor:not-allowed;opacity:0.5"}">${saveBtnLabel}</button>`);
  saveBtn.onclick=async()=>{
    if(!assignSlot) return;
    // Clear any old slot for this wine
    for(const lid of Object.keys(LOCATIONS))
      for(const [sl,wid] of Object.entries(slots[lid]||{}))
        if(wid===wine.id) await clearSlot(lid,sl);
    await saveSlot(assignLoc,assignSlot,wine.id);
    root.innerHTML="";
  };
  sheet.appendChild(saveBtn);
  overlay.appendChild(sheet);
  root.appendChild(overlay);
}
