  sheet.appendChild(html(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">
    <div class="color-dot" style="background:${colorDot(wine.color)}"></div>
    <span style="color:var(--brown-mid);font-size:11px;letter-spacing:2px;text-transform:uppercase">${wine.color||""}${wine.varietal?" · "+wine.varietal:""}</span>
  </div>`));
  sheet.appendChild(html(`<div style="font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:800;color:var(--ink);line-height:1.2;margin-bottom:2px">${wine.wine}</div>`));
  sheet.appendChild(html(`<div style="color:var(--brown-light);font-size:14px;font-style:italic;margin-bottom:14px">${wine.winery}</div>`));

  // Tags
  const tags=document.createElement("div"); tags.style.cssText="display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap";
  if(wine.vintage) tags.appendChild(html(`<span class="pill">${wine.vintage}</span>`));
  if(wine.region)  tags.appendChild(html(`<span class="pill">${wine.region}</span>`));
  if(wine.score)   tags.appendChild(html(`<span class="pill" style="background:${scoreColor(wine.score)}18;border-color:${scoreColor(wine.score)}44;color:${scoreColor(wine.score)};font-weight:800;font-family:monospace">${wine.score}pts</span>`));
  if(wine.price>0) tags.appendChild(html(`<span class="pill">$${wine.price}/btl</span>`));
  sheet.appendChild(tags);

  // Drink window
  if(status){
    const dw=html(`<div style="background:${status.color}18;border:1px solid ${status.color}33;border-radius:12px;padding:12px 14px;margin-bottom:14px">
      <div style="color:${status.color};font-size:13px;font-weight:700;margin-bottom:${status.pct!==undefined?6:0}px">${status.emoji} ${status.label}</div>
      ${wine.drinkFrom?`<div style="color:var(--brown-pale);font-size:11px;margin-bottom:${status.pct!==undefined?8:0}px">Window: ${wine.drinkFrom}–${wine.drinkTo}</div>`:""}
    </div>`);
    if(status.pct!==undefined){
      const bar=html(`<div class="drink-bar"><div class="drink-bar-fill" style="width:${status.pct}%;background:${status.color}"></div></div>`);
      dw.appendChild(bar);
    }
    sheet.appendChild(dw);
  }

  // Location
  if(loc){
    sheet.appendChild(html(`<div style="background:${loc.color}12;border:1px solid ${loc.color}33;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px">
      <div style="font-size:28px">${loc.icon}</div>
      <div>
        <div style="color:var(--brown-pale);font-size:10px;letter-spacing:2px;text-transform:uppercase">Stored in</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:800;color:${loc.color}">${loc.name}</div>
        <div style="color:var(--ink);font-size:24px;font-weight:900;font-family:monospace;letter-spacing:2px">${placement.slot}</div>
      </div>
    </div>`));
  }

  // AI Sommelier
  const aiBox=html(`<div style="background:rgba(184,134,11,0.06);border:1px solid rgba(184,134,11,0.2);border-radius:14px;padding:16px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;font-family:'Cormorant Garamond',serif">🤖 AI Sommelier</div>
    </div>
  </div>`);

  if(wine.pairings?.length){
    const inner=document.createElement("div");
    inner.appendChild(html(`<div class="section-label" style="margin-bottom:8px">Food Pairings</div>`));
    const tags2=document.createElement("div"); tags2.style.cssText="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px";
    wine.pairings.forEach(p=>{
      tags2.appendChild(html(`<span style="background:rgba(184,134,11,0.1);border:1px solid rgba(184,134,11,0.2);border-radius:20px;padding:4px 12px;color:var(--gold);font-size:13px">${p}</span>`));
    });
    inner.appendChild(tags2);
    if(wine.drinkWindow){
      inner.appendChild(html(`<div class="section-label" style="margin-bottom:4px">Prime Drinking</div>`));
      inner.appendChild(html(`<div style="color:var(--brown-mid);font-size:13px;line-height:1.6;margin-bottom:10px">${wine.drinkWindow}</div>`));
    }
    if(wine.servingTip){
      inner.appendChild(html(`<div class="section-label" style="margin-bottom:4px">Serving Tip</div>`));
      inner.appendChild(html(`<div style="color:var(--brown-light);font-size:13px;line-height:1.6;font-style:italic">${wine.servingTip}</div>`));
    }
    aiBox.appendChild(inner);
  } else {
    const pending=html(`<div style="display:flex;align-items:center;gap:10px;color:var(--brown-mid);font-size:13px;font-style:italic">
      <div class="spinner"></div>Fetching pairings from AI sommelier…
    </div>`);
    aiBox.appendChild(pending);
  }
  sheet.appendChild(aiBox);

  // Notes
  if(wine.notes){
    sheet.appendChild(html(`<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--brown-mid);font-size:14px;font-style:italic;line-height:1.6;margin-bottom:14px">"${wine.notes}"</div>`));
  }

  // Consume button
  if(placement){
    const consumeBtn=html(`<button class="btn-danger">🍷 Mark as Consumed</button>`);
    consumeBtn.onclick=async()=>{
      const entry={...wine,locId:placement.locId,slot:placement.slot,consumedAt:Date.now()};
      await clearSlot(placement.locId,placement.slot);
      await saveConsumed(entry);
      root.innerHTML="";
    };
    sheet.appendChild(consumeBtn);
  }

  overlay.appendChild(sheet);
  root.appendChild(overlay);
}

// ── SLOT DETAIL MODAL ────────────────────────────────────────────
// ── EDIT WINE MODAL ──────────────────────────────────────────────
let editWineForm = {};

function showEditWineModal(wine) {
  editWineForm = {
    winery:   wine.winery   ||"",
    wine:     wine.wine     ||"",
    vintage:  wine.vintage  ?String(wine.vintage) :"",
    color:    wine.color    ||"Red",
    varietal: wine.varietal ||"",
    region:   wine.region   ||"",
    price:    wine.price    ?String(wine.price)   :"",
    qty:      wine.qty      ?String(wine.qty)     :"1",
    score:    wine.score    ?String(wine.score)   :"",
    drinkFrom:wine.drinkFrom?String(wine.drinkFrom):"",
    drinkTo:  wine.drinkTo  ?String(wine.drinkTo) :"",
    notes:    wine.notes    ||"",
  };
  renderEditWineModal(wine);
}

function renderEditWineModal(wine) {
  const root=el("modal-root"); root.innerHTML="";
  const overlay=document.createElement("div"); overlay.className="modal-overlay";
  const sheet=document.createElement("div"); sheet.className="modal-sheet";
  overlay.onclick=e=>{ if(e.target===overlay) root.innerHTML=""; };
  sheet.appendChild(html(`<div class="modal-handle"></div>`));

  const titleRow=html(`<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"></div>`);
  const back=html(`<button style="background:none;border:none;color:var(--brown-mid);font-size:18px;cursor:pointer;padding:0">←</button>`);
  back.onclick=()=>root.innerHTML="";
  titleRow.appendChild(back);
  titleRow.appendChild(html(`<div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:800;color:var(--ink)">Edit Wine</div>`));
  sheet.appendChild(titleRow);

  const form=document.createElement("div"); form.style.cssText="display:flex;flex-direction:column;gap:13px";

  // Color pills
  const colorRow=document.createElement("div");
  colorRow.appendChild(html(`<div class="field-label">Color</div>`));
  const pills=document.createElement("div"); pills.style.cssText="display:flex;gap:6px";
  COLOR_OPTIONS.forEach(c=>{
    const active=editWineForm.color===c; const dot=colorDot(c);
    const btn=html(`<button style="flex:1;padding:8px 4px;border-radius:9px;border:1px solid ${active?dot:"var(--border)"};background:${active?dot+"22":"transparent"};color:${active?dot:"var(--brown-pale)"};font-size:11px;cursor:pointer;font-family:inherit;font-weight:700">${c}</button>`);
    btn.onclick=()=>{ editWineForm.color=c; renderEditWineModal(wine); };
    pills.appendChild(btn);
  });
  colorRow.appendChild(pills); form.appendChild(colorRow);

  // Winery + Wine Name
  [{key:"winery",label:"Winery *",placeholder:"e.g. Caymus Vineyards"},{key:"wine",label:"Wine Name *",placeholder:"e.g. Special Selection Cabernet"}].forEach(f=>{
    const wrap=document.createElement("div");
    wrap.appendChild(html(`<div class="field-label">${f.label}</div>`));
    const inp=document.createElement("input"); inp.placeholder=f.placeholder; inp.value=editWineForm[f.key];
    inp.oninput=e=>editWineForm[f.key]=e.target.value;
    wrap.appendChild(inp); form.appendChild(wrap);
  });

  // Vintage + Qty
  const row1=html(`<div style="display:flex;gap:10px"></div>`);
  ["vintage","qty"].forEach((k,i)=>{
    const w=document.createElement("div"); w.style.flex="1";
    w.appendChild(html(`<div class="field-label">${i===0?"Vintage":"Quantity"}</div>`));
    const inp=document.createElement("input"); inp.placeholder=i===0?"2021":"1"; inp.value=editWineForm[k]; inp.inputMode="numeric"; if(i===0) inp.maxLength=4;
    inp.oninput=e=>editWineForm[k]=e.target.value.replace(/\D/g,"");
    w.appendChild(inp); row1.appendChild(w);
  });
  form.appendChild(row1);

  // Varietal
  if(!document.getElementById("varietal-suggestions")){
    const dl=document.createElement("datalist"); dl.id="varietal-suggestions";
    VARIETAL_OPTIONS.forEach(v=>{ const o=document.createElement("option"); o.value=v; dl.appendChild(o); });
    document.body.appendChild(dl);
  }
  const varWrap=document.createElement("div");
  varWrap.appendChild(html(`<div class="field-label">Varietal</div>`));
  const varInp=document.createElement("input"); varInp.placeholder="e.g. Cabernet Sauvignon"; varInp.value=editWineForm.varietal;
  varInp.setAttribute("list","varietal-suggestions");
  varInp.oninput=e=>editWineForm.varietal=e.target.value;
  varWrap.appendChild(varInp); form.appendChild(varWrap);

  // Region
  const regWrap=document.createElement("div");
  regWrap.appendChild(html(`<div class="field-label">Region / Appellation</div>`));
  const ri=document.createElement("input"); ri.placeholder="e.g. Napa Valley, CA"; ri.value=editWineForm.region;
  ri.oninput=e=>editWineForm.region=e.target.value;
  regWrap.appendChild(ri); form.appendChild(regWrap);

  // Price + Score
  const row2=html(`<div style="display:flex;gap:10px"></div>`);
  [{k:"price",l:"Price / Bottle ($)",p:"0.00"},{k:"score",l:"Critic Score",p:"92"}].forEach(({k,l,p})=>{
    const w=document.createElement("div"); w.style.flex="1";
    w.appendChild(html(`<div class="field-label">${l}</div>`));
    const inp=document.createElement("input"); inp.placeholder=p; inp.value=editWineForm[k]; inp.inputMode="decimal";
    inp.oninput=e=>editWineForm[k]=e.target.value.replace(/[^0-9.]/g,"");
    w.appendChild(inp); row2.appendChild(w);
  });
  form.appendChild(row2);

  // Drink window
  const row3=html(`<div style="display:flex;gap:10px"></div>`);
  [{k:"drinkFrom",l:"Drink From",p:"2024"},{k:"drinkTo",l:"Drink To",p:"2035"}].forEach(({k,l,p})=>{
    const w=document.createElement("div"); w.style.flex="1";
    w.appendChild(html(`<div class="field-label">${l}</div>`));
    const inp=document.createElement("input"); inp.placeholder=p; inp.value=editWineForm[k]; inp.inputMode="numeric"; inp.maxLength=4;
    inp.oninput=e=>editWineForm[k]=e.target.value.replace(/\D/g,"");
    w.appendChild(inp); row3.appendChild(w);
  });
  form.appendChild(row3);

  // Notes
  const notesWrap=document.createElement("div");
  notesWrap.appendChild(html(`<div class="field-label">Tasting Notes</div>`));
  const ta=document.createElement("textarea"); ta.placeholder="Dark fruit, hints of oak…"; ta.value=editWineForm.notes;
  ta.oninput=e=>editWineForm.notes=e.target.value;
  notesWrap.appendChild(ta); form.appendChild(notesWrap);

  sheet.appendChild(form);

  // Actions: Delete | Save Changes
  const actions=html(`<div style="display:flex;gap:10px;margin-top:20px"></div>`);
  const del=html(`<button class="btn-danger" style="flex:1">Delete</button>`);
  del.onclick=async()=>{
    if(!confirm(`Delete "${wine.wine}"?`)) return;
    await deleteWine(wine.id);
    root.innerHTML="";
  };
  const save=html(`<button class="btn-primary" style="flex:2">Save Changes</button>`);
  save.onclick=async()=>{
    if(!editWineForm.winery.trim()||!editWineForm.wine.trim()){alert("Winery and wine name are required."); return;}
    save.textContent="Saving…"; save.disabled=true;
    await updateWine(wine.id,{
      winery:editWineForm.winery.trim(), wine:editWineForm.wine.trim(),
      vintage:editWineForm.vintage.trim(), color:editWineForm.color||"Red",
      varietal:editWineForm.varietal.trim(), region:editWineForm.region.trim(),
      price:parseFloat(editWineForm.price)||0, qty:parseInt(editWineForm.qty)||1,
      score:parseInt(editWineForm.score)||null,
      drinkFrom:parseInt(editWineForm.drinkFrom)||null,
      drinkTo:parseInt(editWineForm.drinkTo)||null,
      notes:editWineForm.notes.trim(),
    });
    root.innerHTML="";
  };
  actions.appendChild(del); actions.appendChild(save);
  sheet.appendChild(actions);

  overlay.appendChild(sheet);
  root.appendChild(overlay);
}

function showSlotDetail(locId,slot,wine){
  const root=el("modal-root"); root.innerHTML="";
  const loc=LOCATIONS[locId];
  const overlay=document.createElement("div"); overlay.className="modal-overlay";
  const sheet=document.createElement("div"); sheet.className="modal-sheet";
  overlay.onclick=e=>{ if(e.target===overlay) root.innerHTML=""; };

  sheet.appendChild(html(`<div class="modal-handle"></div>`));
  sheet.appendChild(html(`<div style="color:${loc.color};font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px">${loc.icon} ${loc.name} · ${slot}</div>`));
  sheet.appendChild(html(`<div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:800;color:var(--ink)">${wine.wine}</div>`));
  sheet.appendChild(html(`<div style="color:var(--brown-light);font-size:14px;font-style:italic;margin-bottom:10px">${wine.winery}${wine.vintage?" · "+wine.vintage:""}</div>`));

  const tags=document.createElement("div"); tags.style.cssText="display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap";
  if(wine.color)   tags.appendChild(html(`<span class="pill" style="background:${colorDot(wine.color)}22;border-color:${colorDot(wine.color)}44;color:${colorDot(wine.color)}">${wine.color}</span>`));
  if(wine.varietal)tags.appendChild(html(`<span class="pill">${wine.varietal}</span>`));
  if(wine.score)   tags.appendChild(html(`<span class="pill" style="color:${scoreColor(wine.score)};font-weight:800">${wine.score}pts</span>`));
  if(wine.price>0) tags.appendChild(html(`<span class="pill" style="color:var(--brown-mid)">$${wine.price}/btl</span>`));
  sheet.appendChild(tags);

  if(wine.pairings?.length){
    sheet.appendChild(html(`<div class="section-label">Pairs with</div>`));
    const pWrap=document.createElement("div"); pWrap.style.cssText="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px";
    wine.pairings.forEach(p=>pWrap.appendChild(html(`<span style="background:rgba(184,134,11,0.1);border-radius:10px;padding:3px 10px;color:var(--brown-mid);font-size:12px">${p}</span>`)));
    sheet.appendChild(pWrap);
  }

  // Row 1: View Profile | Change Location
  const row1=html(`<div style="display:flex;gap:8px;margin-top:6px"></div>`);
  const profile=html(`<button style="flex:1;padding:12px;border-radius:var(--radius-sm);border:1px solid rgba(184,134,11,0.3);background:rgba(184,134,11,0.08);color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;font-family:'Cormorant Garamond',serif">View Profile</button>`);
  profile.onclick=()=>showWineProfile(wine);
  const move=html(`<button style="flex:1;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--brown-mid);font-size:13px;font-weight:700;cursor:pointer;font-family:'Cormorant Garamond',serif">📍 Move</button>`);
  move.onclick=()=>showAssignModal(wine);
  row1.appendChild(profile); row1.appendChild(move); sheet.appendChild(row1);
  // Row 2: Close | Consumed
  const row2=html(`<div style="display:flex;gap:8px;margin-top:8px"></div>`);
  const close=html(`<button class="btn-ghost" style="flex:1">Close</button>`); close.onclick=()=>root.innerHTML="";
  const consume=html(`<button class="btn-danger" style="flex:2;padding:12px;font-size:13px">🍷 Consumed</button>`);
  consume.onclick=async()=>{
    const entry={...wine,locId,slot,consumedAt:Date.now()};
    await clearSlot(locId,slot);
    await saveConsumed(entry);
    root.innerHTML="";
  };
  row2.appendChild(close); row2.appendChild(consume); sheet.appendChild(row2);

  overlay.appendChild(sheet);
  root.appendChild(overlay);
}

// ── Boot ─────────────────────────────────────────────────────────
initPin();

// Expose globals for inline handlers
window.pinPress  = pinPress;
window.pinDelete = pinDelete;
window.switchTab = switchTab;

</script>
